!DOCTYPE html>
<html>
<head>
    <title>Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Marks Calculator</h1>
<input type="number" id="sub1" placeholder="Subject 1"><br>
    <input type="number" id="sub2" placeholder="Subject 2"><br>
    <input type="number" id="sub3" placeholder="Subject 3"><br>
    <input type="number" id="sub4" placeholder="Subject 4"><br>
    <input type="number" id="sub5" placeholder="Subject 5"><br>

    <button onclick="calculate()">Calculate</button>
 
    <h3 id="total"></h3>
    <h3 id="average"></h3>
    <h3 id="grade"></h3>
</div>

<script src="script.js"></script>

</body>
</html>
